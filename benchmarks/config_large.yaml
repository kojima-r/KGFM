# Large scale — numbers intended to be reportable.
# Estimated wall clock: ~10.8 h of a 12 h budget (ULTRA 7.9 h + MOTIF 0.5 h +
# kgfm 2.3 h).
#
# Publication-grade choices, following the guidance in README.md:
#   prep_max_test >= 10,000   so the MRR standard error is ~+-0.004
#   n_eval_triples = prep_max_test  so kgfm evaluates as many triples as the KG
#   max_filter_tails ~= |E|   so filtered ranking is against the real vocabulary
#   freezes: [off, on]        fine-tuned vs frozen-encoder ablation
#
# Sized for a single H200 (143 GB). Runtime estimates come from measured
# throughput on this machine, not guesses:
#   ngram train    ~20,000 examples/s      transformer train ~1,500 examples/s
#   ULTRA (CPU)     1134 s  @ n_test=2,000, n_train=50,000
#   MOTIF (GPU)       70 s  @ the same point
# ULTRA and MOTIF cost scale as n_test x n_train (message passing over every
# edge, per query). ULTRA runs on CPU because its rspmm kernel crashes on
# sm_90, which makes it the dominant term in every config below — skipping it
# (run only `kgfm bench run` + `kgfm-motif`) roughly halves the wall clock.
#
# ---------------------------------------------------------------------------
# The file has two levels:
#   top level   run-level settings. One value for the whole run.
#   defaults:   cell-level settings applied to every cell.
#   cells:      cell-level settings for one cell, keyed by <encoder>[_frozen].
# A bench CLI flag overrides every cell, including anything under `cells:`.
# ---------------------------------------------------------------------------

run_label: chembl_large

# --- run-level ---

# |E| ~ 280,000 at this cap
prep_max_train: 250000
prep_max_valid: 10000
prep_max_test: 10000

encoders: [ngram, transformer]
# "on" adds a frozen-encoder cell (projection head only) — the ablation that
# separates "the LM already knew this" from "fine-tuning learned it".
freezes: ["off", "on"]
protocols: [pooled, filtered]

# --- every cell ---
defaults:
  max_steps: 25000

  # One batch size for every cell on purpose: max_steps then means the same
  # amount of data for ngram and transformer, so their curves are comparable
  # step-for-step. B is also a *modeling* knob here — in_batch_negative_loss
  # scores each (h,r) against every other tail in the batch, so B-1 is the
  # number of negatives. Under DDP that matrix is built per rank, so B is the
  # per-GPU batch and --nproc does not change the negative count.
  #
  # 512 is measured, not guessed. On this H200, per training step:
  #   transformer  B=256  1,127 ex/s  12.3 GiB | B=512  3,014 ex/s  22.2 GiB
  #                B=384  2,610 ex/s  17.2 GiB | B=768  2,919 ex/s  32.2 GiB
  #   ngram        B=256 17,690 ex/s   5.1 GiB | B=4096 21,904 ex/s  5.2 GiB
  # The transformer peaks at 512 (768 is slower and uses 45% more memory), and
  # ngram is within 5% of its plateau there. 22 GiB of 143 GiB leaves plenty
  # of headroom for the eval passes, which encode the whole tail vocabulary.
  batch_size: 512

  # Mandatory whenever freezes contains "on": with a frozen encoder and no
  # projection the optimizer sees zero trainable parameters. A no-op for
  # ngram, which is already 256-dim so the projection collapses to
  # nn.Identity.
  proj_dim: 256

  n_eval_triples: 10000
  pool_size: 10000

  max_filter_tails: 310000
  max_filter_rows: 10000000

# --- one cell at a time ---
cells:
  # The only cell that overfits: on the 2026-08-09 large run its train loss
  # kept falling (2.25 -> 1.97 over 25k steps) while valid loss bottomed at
  # step 12.5k and rose to 4.84 by the end. The other two cells did not.
  # Decay the encoder, leave the head alone — it is one Linear.
  transformer:
    encoder_weight_decay: 0.01
    head_weight_decay: 0.0

  # A frozen encoder trains only the projection head, so encoder-side
  # regularization has nothing to act on; dropout on the head is the knob that
  # still does something. This cell was the only one whose valid loss did not
  # rise, so it gets a light touch.
  transformer_frozen:
    head_dropout: 0.1
