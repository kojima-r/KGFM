# Extra-large scale — the most thorough run that still finishes overnight.
# Estimated wall clock: ~21.2 h of a 24 h budget (ULTRA 15.1 h + MOTIF 0.9 h +
# kgfm 5.1 h). Use resume_chembl.sh if it is interrupted.
#
# Same publication-grade choices as config_large.yaml, with more training
# (60k steps = 30.7M examples seen) and a larger, harder KG.
#
# Sized for a single H200 (143 GB). Runtime estimates come from measured
# throughput on this machine, not guesses:
#   ngram train    ~20,000 examples/s      transformer train ~1,500 examples/s
#   ULTRA (CPU)     1134 s  @ n_test=2,000, n_train=50,000
#   MOTIF (GPU)       70 s  @ the same point
# ULTRA and MOTIF cost scale as n_test x n_train (message passing over every
# edge, per query). ULTRA runs on CPU because its rspmm kernel crashes on
# sm_90, which makes it the dominant term in every config below — skipping it
# (run only `kgfm bench run` + `kgfm-motif`) roughly halves the wall clock.
#
# See config_large.yaml for the two-level layout (top level / defaults: /
# cells:).

run_label: chembl_xlarge

# --- run-level ---

# |E| = 419,252 at this cap (measured by a prep run, not estimated)
max_train: 400000
max_valid: 12000
max_test: 12000

encoders: [ngram, transformer]
freezes: ["off", "on"]
protocols: [pooled, filtered]

# --- every cell ---
defaults:
  max_steps: 60000

  # See config_large.yaml for the measured throughput/memory table behind 512.
  # Under DDP the in-batch logit matrix is built per rank, so this is the
  # per-GPU batch and --nproc does not change the negative count.
  batch_size: 512
  proj_dim: 256

  n_eval_triples: 12000
  pool_size: 12000

  max_filter_tails: 460000
  max_filter_rows: 10000000

# --- one cell at a time ---
cells:
  # 60k steps is 2.4x the large run, so the cell that already overfit there
  # has more room to do it. Same treatment, slightly stronger.
  transformer:
    encoder_weight_decay: 0.01
    head_weight_decay: 0.0
    encoder_dropout: 0.15

  transformer_frozen:
    head_dropout: 0.1
