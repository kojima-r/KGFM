# Smoke scale — proves the pipeline end to end in a few minutes.
# Selected with: kgfm bench run --config benchmarks/config_small.yaml
#
# The file has two levels. Run-level settings sit at the top; cell-level
# settings go under `defaults:` (every cell) or `cells: <tag>:` (one cell,
# tagged <encoder>[_frozen]). Unknown keys are rejected rather than ignored,
# and a cell-level key at the top level is an error that says where to put it.
# A bench CLI flag is a single global override and beats both levels.

run_label: chembl_small

# --- run-level ---

# Triple caps for the entity-ID KG the baselines consume. Both are well under
# 0.1% of the corpus — see "全コーパスに対する --max-* のカバー率" in README.
max_train: 50000
max_valid: 2000
max_test: 2000

encoders: [ngram, transformer]
freezes: ["off"]          # quote: bare `off` is boolean False in YAML
protocols: [pooled, filtered]

# --- every cell ---
defaults:
  max_steps: 200
  batch_size: 256

  # filtered-protocol candidate caps
  max_filter_tails: 50000
  max_filter_rows: 1000000

# No `cells:` block: at 200 steps nothing overfits, so there is nothing worth
# tuning per cell. See config_large.yaml for an example that uses one.
