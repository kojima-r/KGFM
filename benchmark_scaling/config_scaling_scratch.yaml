# Scaling study with pretraining removed from the size axis.
#
# WHY A SECOND CONFIG
# `config_scaling.yaml` sweeps pretrained encoders, which varies two things at
# once: bigger models in the Turc et al. family were also *pretrained longer*,
# and `bge-large` vs `bert-medium` differ in corpus and objective as well as in
# size. An exponent fitted across that is not a statement about capacity.
#
# Here every cell is the same architecture family at five sizes, randomly
# initialized (`random_init: True` -> AutoModel.from_config, no weights
# downloaded). Size is then the only thing that varies, which is what makes the
# fit readable as a capacity law. The price is that these models start from
# nothing, so they need more steps and a larger learning rate than a
# fine-tuning run does.
#
# SIZES (trainable parameters)
#   scratch-tiny      4.4M
#   scratch-mini     11.2M
#   scratch-small    28.8M
#   scratch-medium   41.4M
#   scratch-base    109.5M
#   scratch-xl      234.6M
#   scratch-large   335.4M
# 1.9 decades of N. Compare with the pretrained study side by side: the gap
# between the two exponents IS the contribution of pretraining.
#
# READ THE REPORT ON BOTH Y-AXES. Validation loss is bounded above by ln(B) and
# floored by repeated tails; `1 - MRR` is not, and on the 2026-08-24 run the
# BERT family fitted b=-0.33 (R^2=0.84) there against b=-0.04 (R^2=0.66) on
# loss. `kgfm scaling` plots and fits both.

run_label: scaling_scratch
results_root: benchmark_scaling/results/chembl

# --- run-level ---
prep_max_train: 400000
prep_max_valid: 12000
prep_max_test: 12000

encoders:
  - scratch-tiny
  - scratch-mini
  - scratch-small
  - scratch-medium
  - scratch-base
  # 16x1024 / 234M — 2.1x BERT-base. Added when bert-large's own 24x1024 /
  # 335M appeared not to fit; it does (see scratch-large below), so this is an
  # interior point of the axis rather than a substitute for one. It is also the
  # cell that wins on MRR: 0.5142 in-loop / 0.4979 on the final test, better
  # than both 109M and 335M.
  - scratch-xl
  # 24x1024 / 335M, the top of the axis on one H200. This cell used to be
  # impossible: it trained at B=256 and then OOMed in the first in-loop
  # evaluation. That was not a size limit -- TransformerEncoder.forward forced
  # torch.enable_grad() over the ambient no_grad, so every evaluation built a
  # training-sized graph it never used. With that fixed the cell runs end to
  # end and the binding constraint moved back to training: measured at B=256,
  # train_peak 101.81 GiB against eval_peak 7.98 of 139.8.
  - scratch-large
heads: [linear]
freezes: ["off"]
protocols: [pooled]

# --- every cell ---
defaults:
  # 12x config_scaling.yaml's budget. A randomly initialized model spends its
  # first few thousand steps learning what the pretrained ones already knew, so
  # a 4000-step window would put every size in that transient and compare
  # warm-up speeds rather than capacity.
  #
  # Raised from 16000 after the 2026-08-26 run, where the two largest cells
  # were still improving when the budget ran out: `scratch-medium` reached its
  # best validation loss at step 15,750 of 16,000 and `scratch-base` at 16,000
  # exactly — i.e. at the last measurement, so both numbers were LOWER BOUNDS,
  # not optima. The small cells were long since past their best (tiny bottomed
  # at 1,500), so the budget was binding only at the top of the size axis —
  # which biases the fitted exponent flat, because the largest models are the
  # ones being cut short.
  #
  # STILL BINDING at 48000, measured on the 7-cell run: best valid loss lands
  # at step 45,500 (mini) / 41,750 (small) / 42,750 (medium) / 47,500 (base) /
  # 47,500 (large) of 48,000. Only scratch-xl (37,250) and scratch-tiny
  # (28,250) have interior minima, so five of seven "best" numbers are lower
  # bounds and the flat-exponent bias above has not been removed, only moved
  # up the size axis. Raising this again is the next lever if the exponent
  # matters more than wall clock (scratch-large alone is 8.5 h at 48k).
  max_steps: 48000
  batch_size: 256
  proj_dim: 256

  # These ARE the scaling data points, so they are dense on purpose. Kept at
  # 250 rather than scaled with max_steps: an eval costs ~4s against ~150s of
  # training per 250 steps, so density here is nearly free, and the mid-run
  # non-monotonicity documented below is only visible at this resolution.
  eval_every: 250
  # 8 batches at B=256 is 2,048 rows per measurement, and `best valid loss` is
  # the MINIMUM over 192 such measurements -- so it is a min-of-192 on a noisy
  # statistic and is biased downward by however much a cell happens to wobble.
  # Measured on the 7-cell run, the last five points of the two best cells:
  #   scratch-base  2.8260 2.8138 [2.7577] 2.8088 2.7924
  #   scratch-large 3.0227 3.0231 [2.9485] 3.0356 2.9952
  # The bracketed headline numbers are noise dips on a plateau, not the end of
  # a trend. Differences around 0.05 nats are therefore NOT resolvable here.
  # Raise this (or compare a late-run mean instead of the min) before ranking
  # cells that land this close; it is cheap, an eval costs ~4 s against ~150 s
  # of training per 250 steps.
  valid_loss_batches: 8
  log_every: 100

  # No pretrained weights to preserve, so there is nothing for weight decay to
  # protect here; it is kept nonzero only to match the pretrained study, which
  # is the run this one is meant to be compared against.
  encoder_weight_decay: 0.01
  head_weight_decay: 0.0

  n_eval_triples: 6000
  pool_size: 6000
  max_filter_tails: 460000
  max_filter_rows: 10000000

# Per-size learning rates, MEASURED, not assumed, and RE-MEASURED under
# head_mode=separate. `benchmark_scaling/lr_probe.py` swept these exact cell
# settings (2000 steps, B=256) on 2026-09-21; every value below is an interior
# optimum, not a grid edge. Selected on validation loss — a rate is tuned
# against what the optimizer minimizes; the probe's MRR column is a
# cross-check only.
#
# THE RATES ARE NOT THE SHARED-HEAD ONES, AND THAT IS THE POINT. Flipping the
# default head_mode to `separate` (kgfm/heads.py, 2026-09-21) gives each of
# h/r/t its own projection, tripling the head. Re-probing moved four of the
# seven rates, `mini` and `small` by a full decade:
#
#             shared    separate
#   tiny       1e-4       1e-4
#   mini       3e-5       3e-4      <- 10x
#   small      1e-5       1e-4      <- 10x
#   medium     3e-5       3e-5
#   base       1e-5       3e-5      <- 3x
#   xl         1e-5       1e-5
#   large      3e-6       1e-5      <- 3x
#
# Reusing the shared-head rates would have run four cells at a third to a
# tenth of their optimum — the same confound this table exists to remove,
# reintroduced by a change to a different part of the model. A rate is a
# property of (architecture, corpus, head wiring), not of size alone.
#
# Best validation loss per (size, rate) under separate. `collapse` = within
# 0.5% of ln(256)=5.5452, i.e. never left the random-guess fixed point:
#
#                 1e-6    3e-6    1e-5    3e-5    1e-4    3e-4    1e-3    3e-3
#   tiny            --   4.4883  3.7472  3.3867 [3.1749] 3.1955   --      --
#   mini            --   3.9468  3.5038  3.1926  3.1627 [3.1212]  coll    coll
#   small           --   3.6810  3.2329  3.1715 [3.1533]  coll    --      --
#   medium          --   3.5902  3.1712 [3.1217] 3.1337   coll    --      --
#   base            --   3.3414  3.1452 [3.1209]  coll    coll    --      --
#   large        3.5421  3.2240 [3.0958]  coll    coll    --      --      --
#   xl              --   3.2332 [3.1718]  coll    --      --      --      --
#
# WHY THIS MATTERS MORE THAN A USUAL HYPERPARAMETER TABLE. `train.SCRATCH_LR`
# is 1e-4, and under separate that rate collapses `base`, `large` and `xl`
# outright. Run on the single default, this study's three largest cells would
# have sat on the random-guess line and the size axis would have reported
# "capacity does not help" — a flat exponent manufactured by the learning
# rate, not a measurement.
#
# Note what separate changed about the *shape* of the axis, not just the
# rates: at 2000 steps `scratch-large` is now the best cell on the grid
# (3.0958), where under shared it was among the worst (3.2652, behind base's
# 3.1200). Do not read that as "large wins" — a 2000-step probe brackets the
# rate and does not rank sizes, and from random init a bigger model spends
# more of a short probe in its transient. The 48k-step run is the ranking.
#
# The tolerated rate still falls with size but not smoothly: base and medium
# share an optimum (3e-5) and base is marginally better at it (3.1209 vs
# 3.1217), while xl tolerates less than the larger `large` does — xl
# collapses at 3e-5 where large only collapses there too but peaks higher, at
# 1e-5. Depth and width do not trade off cleanly on this axis.
#
# DO NOT ADD EARLY STOPPING HERE. Measured on the 2026-08-26 run: validation
# loss for the two largest cells is *two-phase* — it falls, rises for several
# thousand steps, then falls again to a much better minimum. medium's best in
# the first quarter of the run is 3.1430 against 3.0087 later; base's is 3.1305
# against 3.0018. Patience-based stopping at 4, 8 or 16 evaluations all fire
# during the rise and truncate both cells ~0.13 nats short — seven times the
# entire spread of the three 4-layer cells, enough to erase "the largest model
# is best" and flatten the size axis exactly as a wrong learning rate would.
cells:
  scratch-tiny:
    lr: 1.0e-4
  scratch-mini:
    lr: 3.0e-4
  scratch-small:
    lr: 1.0e-4
  scratch-medium:
    lr: 3.0e-5
  scratch-base:
    lr: 3.0e-5
  # Interior, same grid as the others: 3e-6 -> 3.2332, 1e-5 -> 3.1718,
  # 3e-5 -> collapse (ln(256)=5.5452). Unmoved by the shared->separate flip.
  scratch-xl:
    lr: 1.0e-5
  # Interior: 1e-6 -> 3.5421, 3e-6 -> 3.2240, 1e-5 -> 3.0958, and both
  # 3e-5 and 1e-4 collapse. Moved 3x by the shared->separate flip (was 3e-6);
  # the header block explains why the probe's ordering of the sizes here is
  # not a ranking of them.
  scratch-large:
    lr: 1.0e-5
