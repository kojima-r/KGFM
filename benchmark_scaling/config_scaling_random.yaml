# Model-size scaling law on a RANDOM MULTI-SOURCE corpus, not on ChEMBL.
#
# WHY THIS CONFIG EXISTS
# config_scaling_scratch.yaml measures the size axis on `list_chembl`, which is
# one domain: every row is a ChEMBL activity assertion, and one file is one
# activity-ID population. A scaling exponent measured there could be a property
# of that domain rather than of the task. This config runs the same axis on
# `list_random` — 196 files drawn uniformly at random from all 22,886 TSVs under
# data/, spanning 11 sources (uniprot, wikidata, biosampleplus, expressionatlas,
# bioportal, biomodels, clinvar, oma, pubtator, chembl, pubmed). Same 6-column
# contract everywhere, wildly different content.
#
# The list is bigger than ChEMBL's, which is the point of comparison:
#   ChEMBL train      85 files   105.35 GiB   674,265,105 rows
#   random train     150 files   119.80 GiB   720,653,921 rows
# (valid 18 files / 33,116,566 and test 28 / 151,169,502, both also larger than
# ChEMBL's. All counted with data.count_rows, not estimated. The size axis does
# not actually depend on this — 24k steps x B=256 is under 0.01 of an epoch on
# either corpus, so both are effectively infinite data here. What differs is
# the *content*.)
# Built by:
#   python preprocess_list/make_lists.py --source all --sample-bytes 150GiB \
#       --min-bytes 4096 --random-seed 0 --validate --out-dir list_random
#
# WHAT IS HELD IDENTICAL TO THE ChEMBL RUN, SO THE EXPONENTS ARE COMPARABLE
#   the same seven `scratch-*` sizes, same B=256, same proj_dim, same head,
#   same eval_every/valid_loss_batches, same weight decay.
# WHAT DIFFERS, DELIBERATELY
#   the lists, and max_steps (24000 here against 48000 there). The ChEMBL run's
#   own curves can be re-fitted truncated to 24k for a matched-budget baseline
#   — its cell logs hold every validation point — which is how the comparison
#   is made honest without paying for 48k steps twice.
#   `benchmark_scaling/compare_corpora.py` does that matching (common sizes,
#   shorter budget) and prints the unmatched fits beside it so the effect of
#   the matching is visible rather than assumed. Do not hardcode a baseline
#   number here: it depends on which sizes both runs happen to have.
#
# LEARNING RATES ARE RE-PROBED ON THIS CORPUS, NOT COPIED FROM ChEMBL.
# A tolerated rate is a property of (architecture, corpus), so reusing ChEMBL's
# would confound "this corpus scales differently" with "ChEMBL's rate suits it
# worse" — the same mistake benchmark_scaling/README.md documents for the size
# axis. Run, in order:
#   bash benchmark_scaling/run_lr_probe_random.sh         # 3e-6 .. 1e-4, 5 sizes
#   bash benchmark_scaling/run_lr_probe_random_extend.sh  # 3e-4, 1e-3 upward
#   bash benchmark_scaling/run_lr_probe_random_large.sh   # xl + large, 1/GPU
# and paste the merged `cells:` block below. The upward extension is not
# optional: on this corpus the first grid returned its *top* value for the two
# smallest sizes, which is a bound rather than an optimum.
#
# COST: ~16 h of GPU time for all seven cells at 24k steps (the five small
# ones measured 6.21 h; xl and large add roughly 3.5 h and 5 h). Split over two
# cards it is about 8 h of wall clock. `--resume` skips cells whose JSON is
# already in the run directory, so the two large cells can be added to an
# existing five-cell run instead of repeating it.
#
#   bash benchmark_scaling/run_scaling_random.sh

run_label: scaling_random
results_root: benchmark_scaling/results/random

# --- run-level ---
train_list: list_random/train.txt
valid_list: list_random/valid.txt
test_list: list_random/test.txt

# Only feeds `kgfm bench prep` (the KG for ULTRA/MOTIF), which this study does
# not read. Kept at the other studies' value for a comparable run directory.
prep_max_train: 400000
prep_max_valid: 12000
prep_max_test: 12000

# The full random-init family, 4.4M -> 335.4M (1.9 decades of N), same seven
# sizes as config_scaling_scratch.yaml so the two corpora are compared over an
# identical size range.
#
# `scratch-large` fits at B=256 on this corpus: activation memory is set by
# padded sequence length, and that is **the same on both corpora** — measured
# 76,214 tokens/step here against 76,178 on ChEMBL, i.e. 99.2 of the 128-token
# cap either way, because both sets of RDF URIs are long enough to saturate it.
# So ChEMBL's measured train_peak of 101.81 GiB of 139.8 carries over. Do not
# infer this from character counts (uniprot text is ~50% longer than ChEMBL's);
# the tokenizer output is what matters and it is identical.
encoders:
  - scratch-tiny
  - scratch-mini
  - scratch-small
  - scratch-medium
  - scratch-base
  - scratch-xl
  - scratch-large
heads: [linear]
freezes: ["off"]
protocols: [pooled]

# --- every cell ---
defaults:
  max_steps: 24000        # x 256 = 6,144,000 examples per cell
  batch_size: 256
  proj_dim: 256

  # These ARE the scaling data points, so they are dense: 96 per cell.
  eval_every: 250
  valid_loss_batches: 8
  log_every: 100

  encoder_weight_decay: 0.01
  head_weight_decay: 0.0

  n_eval_triples: 6000
  pool_size: 6000
  max_filter_tails: 460000
  max_filter_rows: 10000000

# Per-size learning rates, MEASURED ON THIS CORPUS and RE-MEASURED under
# head_mode=separate by `benchmark_scaling/lr_probe.py` (2000 steps, B=256,
# these exact cell settings, 2026-09-21). Every value is an interior optimum,
# not a grid edge.
#
# Best validation loss per (size, rate). `coll` = within 0.5% of
# ln(256)=5.5452, i.e. the model never left the random-guess fixed point:
#
#              1e-6    3e-6    1e-5    3e-5    1e-4    3e-4    1e-3    3e-3
#   tiny         --      --   3.9870  3.4196  3.1441  3.0186 [2.9904]  coll
#   mini         --      --   3.5882  3.2481  3.0677 [2.8174]  coll     --
#   small        --      --   3.4120  3.0507 [2.8498]  coll     coll    --
#   medium       --      --   3.2885  3.0777 [2.9275]  coll     coll    --
#   base         --      --   3.1107 [3.0705]  coll     --      --      --
#   xl           --    3.4765 [3.2290]  coll    --      --      --      --
#   large      3.5912  3.4801 [3.2143]  coll    --      --      --      --
#
# TWO SHIFTS ARE STACKED HERE, AND THEY ARE DIFFERENT THINGS. Flipping the
# default head_mode to `separate` moved five of the seven rates on this
# corpus (3x each, except tiny at 3.3x); base and xl did not move:
#
#   size     shared   separate
#   tiny       3e-4     1e-3
#   mini       1e-4     3e-4
#   small      3e-5     1e-4
#   medium     3e-5     1e-4
#   base       3e-5     3e-5
#   xl         1e-5     1e-5
#   large      3e-6     1e-5
#
# COMPARE WITH ChEMBL under the same head_mode (config_scaling_scratch.yaml):
# 1e-4 / 3e-4 / 1e-4 / 3e-5 / 3e-5 / 1e-5 / 1e-5 for the same seven sizes.
#
#   size     random   ChEMBL   ratio
#   tiny       1e-3     1e-4   10.0x
#   mini       3e-4     3e-4    1.0x
#   small      1e-4     1e-4    1.0x
#   medium     1e-4     3e-5    3.3x
#   base       3e-5     3e-5    1.0x
#   xl         1e-5     1e-5    1.0x
#   large      1e-5     1e-5    1.0x
#
# **Under separate the corpus gap has NARROWED to two of seven sizes** (tiny
# 10x, medium 3.3x), where under shared it was 3x at four of seven. The two
# corpora now agree on five of seven rates. That is worth stating carefully:
# the head wiring and the corpus both move the optimum, and re-probing one
# while assuming the other is what produces a confidently wrong exponent.
# Rates that collapse on ChEMBL (small and medium at 3e-4) still train here,
# so the corpus effect is real -- it is just smaller than it looked, and
# concentrated at the small end.
#
# Loss and MRR pick the same rate for mini/small/base/xl/large. They disagree
# for `scratch-tiny` and `scratch-medium` (MRR prefers a higher rate in both
# cases) -- selection is on loss per benchmark_scaling/README.md, because a
# rate is tuned against what the optimizer minimizes. The disagreement is
# reported rather than resolved by switching criteria.
cells:
  scratch-tiny:
    lr: 0.001
  scratch-mini:
    lr: 0.0003
  scratch-small:
    lr: 0.0001
  scratch-medium:
    lr: 0.0001
  scratch-base:
    lr: 3e-05
  scratch-large:
    lr: 1e-05
  scratch-xl:
    lr: 1e-05
