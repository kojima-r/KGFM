# Scaling study, frozen encoders — "what does the pretrained representation
# already know?", measured against compute rather than against wall clock.
#
# The companion to config_scaling.yaml. Every cell is frozen, so only the
# projection head trains and the axis means the same thing for all of them:
#   compute  = 2*N*T for the encoder (forward only — no backward through the
#              LM) + 6*N_head*V for the head
#   "size"   = the ENCODER's parameters, which is what actually varies; the
#              trainable count is just the head and is nearly constant.
# That is also why e5-mistral-7b belongs here and not in the fine-tuning
# study: frozen is the only way it runs at all.
#
# Note the head is the entire trained model in every cell, so this study
# measures representation quality per FLOP, not learning capacity.

run_label: scaling_frozen
results_root: benchmark_scaling/results/chembl

prep_max_train: 400000
prep_max_valid: 12000
prep_max_test: 12000

# LEARNING RATE: DELIBERATELY LEFT ON THE DEFAULT, AND THAT IS A MEASUREMENT.
# A frozen cell trains the projection head and nothing else, so `train.default_lr`
# hands it 1e-3. head_mode=separate (the default since 2026-09-21) triples the
# head, which here means tripling the *entire trainable model* -- the largest
# relative effect the head wiring has anywhere in this repo -- so the rate was
# re-probed rather than assumed (benchmark_scaling/results/lr_probe_sep_frozen,
# 2000 steps at B=256, these exact settings):
#
#                       1e-4    3e-4    1e-3    3e-3    1e-2
#   mpnet              3.3916  3.3693 [3.3685] 3.3791  3.4013
#   bert-multilingual  3.2445  3.2232 [3.2226] 3.2410  3.2265
#   bge-large          3.2224  3.1888  3.2038 [3.1773] 3.1959
#   xlm-roberta-large  3.2819 [3.2393] 3.2520  3.2445    --
#   e5-mistral-7b      3.2485 [3.2402] 3.2665  3.2711    --
#
# **Nothing collapses, anywhere, across two decades**, and the whole spread per
# row is 0.03-0.05 nats. Two of five land exactly on the 1e-3 default and the
# other three beat it by 0.013-0.027 -- below the ~0.05 that a min-over-8-batch
# statistic can resolve. So no per-cell rates are pinned here: writing them in
# would be fitting noise and would imply a precision this probe does not have.
# Contrast the fine-tuned sweep (config_scaling.yaml), where the same probe
# found six of eight cells a decade off and three rates that collapse outright.
# The difference is structural, not luck: head-only training is a small,
# well-conditioned problem with no pretrained weights to destroy.
#
encoders:
  - mpnet                # 110M
  - bert-multilingual    # 178M
  - bge-large            # 335M
  - xlm-roberta-large    # 560M
  - e5-mistral-7b        # 7.1B, bf16
heads: [linear]
freezes: ["on"]          # frozen everywhere; `proj_dim` is mandatory with it
protocols: [pooled]

defaults:
  max_steps: 4000
  batch_size: 256
  # Mandatory when freezing: without a projection the model has no trainable
  # parameters at all and the optimizer sees nothing.
  proj_dim: 256

  eval_every: 100
  valid_loss_batches: 8
  log_every: 50

  n_eval_triples: 6000
  pool_size: 6000
  max_filter_tails: 460000
  max_filter_rows: 10000000
