[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgfm"
version = "0.1.0"
description = "Streaming text-relation prediction with trainable hashed n-gram embeddings or transformer encoders."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ryosuke Kojima", email = "ryosuke.kojima@riken.jp" },
]
keywords = ["knowledge-graph", "relation-prediction", "distmult", "ngram", "transformer", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    # Reads the benchmark settings files in benchmarks/*.yaml.
    "pyyaml",
]

[project.optional-dependencies]
transformer = [
    # transformers 5.x requires torch>=2.7 (uses torch.float8_e8m0fnu).
    # The benchmark env is pinned to torch==2.5.1 (for ULTRA's rspmm
    # CUDA extension), so we cap transformers at the last 4.x release.
    "transformers>=4.30,<5.0",
]
# `kgfm hf` — publishing a trained scorer to the HuggingFace Hub.
hf = [
    "huggingface_hub>=0.20",
]
# Richer `kgfm report` charts. Without these the report still renders, using
# a built-in SVG fallback.
report = [
    "matplotlib",
    "plotly",
    # `kgfm viz` falls back to PCA (torch SVD) when this is absent.
    "umap-learn",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
kgfm = "kgfm.cli:main"
# ULTRA / MOTIF are other people's methods, not kgfm subcommands. They only
# share the run directory that `kgfm report` reads.
kgfm-ultra = "kgfm.baselines.ultra:main"
kgfm-motif = "kgfm.baselines.motif:main"

[project.urls]
Homepage = "https://github.com/ryosuke-kojima/kgfm"
Issues = "https://github.com/ryosuke-kojima/kgfm/issues"

[tool.setuptools.packages.find]
include = ["kgfm*"]
exclude = ["checkpoints*", "data*", "list_*"]
